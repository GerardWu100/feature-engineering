# Simple stock OHLCV feature engineering configuration.
# Run: uv run python run.py --config config.toml

[run]
# Pipeline version stamped into output filenames.
version = "1.0.0"

# Data source: "clickhouse" for database runs, "csv" for local files.
source = "clickhouse"

# ClickHouse table inside the firstrate database when source = "clickhouse".
table = "stocks"

# Optional local CSV path when source = "csv".
# input_path = "data/raw/prices.csv"

# Symbols are processed independently so rolling features never mix tickers.
symbols = ["AAPL", "MSFT"]

# Inclusive date range in YYYY-MM-DD format.
start_date = "2023-01-01"
end_date = "2024-12-31"

# Trading session filter: "regular" (09:30-15:59), "extended" (04:00-19:59), or
# "full" (all bars). Applies to both sources. When omitted, ClickHouse runs
# default to "regular" and CSV runs default to "full" because daily CSV bars are
# stamped at midnight and a "regular" default would drop them all.
session = "regular"

# IANA timezone of the exchange, used to convert timezone-aware input
# timestamps to exchange-local wall-clock time. Naive timestamps are assumed
# to already be exchange-local. US equities: "America/New_York".
exchange_timezone = "America/New_York"

# Output formats: "parquet" and/or "csv".
output_formats = ["parquet", "csv"]

# Directory for generated feature outputs.
output_dir = "outputs/stocks"

[data_quality]
# Drop bars where open, high, low, close, or volume is missing after parsing.
drop_missing_numeric_values = true

# Drop bars where open, high, low, or close is zero or negative.
drop_zero_prices = true

# Drop bars where volume is negative. Zero volume is kept: it is a valid
# no-trades bar.
drop_negative_volume = true

# Drop bars where high is below low.
drop_high_lt_low = true

# Drop bars where open or close sits outside the low-high range.
drop_ohlc_violations = true

[features]
# Keep this empty to allow every enabled feature.
include_categories = []

# Exclude forward-looking targets from live feature sets by default.
exclude_categories = ["target"]

# Reset row-count windows and forward shifts at each calendar day. Set true for
# intraday bars so a window never crosses the overnight gap. Leave false for
# daily bars, where one row already is one day.
reset_by_session = false

# Categories:
# - returns: price change features
# - trend: direction and momentum features
# - volatility: price movement size and instability
# - volume: trading activity and liquidity features
# - target: forward-looking labels for supervised learning

[[features.parameters]]
name = "log_return"
function = "log_return"
enabled = true

[[features.parameters]]
name = "simple_return"
function = "simple_return"
enabled = true

[[features.parameters]]
name = "next_1bar_return"
function = "next_n_bar_return"
# Forecast horizon in bars (rows), not calendar days.
bars = 1
enabled = true

[[features.parameters]]
name = "next_20bar_realized_volatility"
function = "next_n_bar_realized_volatility"
# Forward horizon in bars (rows). Target is the standard deviation of the next
# `bars` one-bar log returns, per-bar decimal units, not annualized. Minimum 2.
bars = 20
enabled = true

[[features.parameters]]
name = "moving_average_20"
function = "moving_average"
window = 20
enabled = true

[[features.parameters]]
name = "price_vs_moving_average_20"
function = "price_vs_moving_average"
window = 20
enabled = true

[[features.parameters]]
name = "rate_of_change_20"
function = "rate_of_change"
periods = 20
enabled = true

[[features.parameters]]
name = "rolling_standard_deviation_20"
function = "rolling_standard_deviation"
window = 20
enabled = true

[[features.parameters]]
name = "bar_range_percent"
function = "bar_range_percent"
enabled = true

[[features.parameters]]
name = "volume_ratio_20"
function = "volume_ratio"
window = 20
enabled = true

[[features.parameters]]
name = "dollar_volume"
function = "dollar_volume"
enabled = true

[[features.parameters]]
name = "volume_change"
function = "volume_change"
enabled = true

[[features.parameters]]
name = "rsi_14"
function = "relative_strength_index"
# Wilder smoothing length in bars.
window = 14
enabled = true

[[features.parameters]]
name = "atr_14"
function = "average_true_range"
# Wilder smoothing length in bars. ATR is in price units (dollars).
window = 14
enabled = true

[[features.parameters]]
name = "macd_line"
function = "macd_line"
# Fast and slow EMA spans (fast must be < slow).
fast = 12
slow = 26
enabled = true

[[features.parameters]]
name = "macd_signal"
function = "macd_signal"
fast = 12
slow = 26
# EMA span of the MACD line.
signal = 9
enabled = true

[[features.parameters]]
name = "macd_histogram"
function = "macd_histogram"
fast = 12
slow = 26
signal = 9
enabled = true

[[features.parameters]]
name = "vwap"
function = "vwap"
# Cumulative within each group. Set reset_by_session = true for session VWAP.
enabled = true

[[features.parameters]]
name = "price_vs_vwap"
function = "price_vs_vwap"
enabled = true
