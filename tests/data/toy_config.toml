[run]
version = "toy"
source = "csv"
input_path = "tests/data/toy_prices.csv"
symbols = ["AAPL", "MSFT"]
start_date = "2024-01-02"
end_date = "2024-01-03"
output_formats = ["csv", "parquet"]
output_dir = "outputs/toy"

[data_quality]
drop_missing_numeric_values = true
drop_zero_prices = true
drop_high_lt_low = true
drop_ohlc_violations = true

[features]
include_categories = []
exclude_categories = []
# Toy data is intraday minute bars across two days, so reset windows per session.
reset_by_session = true

[[features.params]]
name = "log_return"
function = "log_return"
enabled = true

[[features.params]]
name = "next_1bar_return"
function = "next_n_bar_return"
bars = 1
enabled = true

[[features.params]]
name = "ma_2"
function = "moving_average"
window = 2
enabled = true

[[features.params]]
name = "bar_range_percent"
function = "bar_range_percent"
enabled = true

[[features.params]]
name = "volume_ratio_2"
function = "volume_ratio"
window = 2
enabled = true
